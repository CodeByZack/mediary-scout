name: CI

on:
  # issue #29 用户拍板(PR #30 修订):分支开着 PR 时同样的 push 会同时触发
  # push 与 pull_request 两个事件 → 同一 commit CI 跑两遍。改为 push 只跑 main
  # (合并后归位验证),PR 靠 pull_request 事件(分支 push 同步触发 synchronize)。
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # SQLite-only project: point tests at a temp db file. The repository
      # contract/schema tests provision their own disposable SQLite files.
      MEDIA_TRACK_SQLITE_PATH: /tmp/ci-mediary.db

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:workflow
      - run: npm run lint
      - run: npm run typecheck
      - run: npx tsc -p apps/web/tsconfig.json --noEmit
      - run: npx tsc -p workers/tmdb-proxy/tsconfig.json --noEmit
      # Production build with NO database — mirrors `docker compose build` (no .env
      # at image-build time). cacheComponents prerenders pages at build; any server
      # component that reads the DB outside a connection()/cookies()/searchParams
      # guard crashes here. This step is what catches that class before it reaches a
      # self-hoster's `docker compose up`. (next.config reads .env with `??=`, so a
      # set-but-empty value is NOT overridden → the real no-DB build condition.)
      - run: npm run build:web
        env:
          MEDIA_TRACK_SQLITE_PATH: ""
      - run: npx vitest run

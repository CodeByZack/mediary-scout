# 一键发版·下篇：merge 即发布，全自动无人值守。
# main 上每次 push 检查：package.json version 相对上一 commit 变了、且 v<新版本> tag
# 不存在 → 打 tag 并在**同一个 run 里**显式调用 build-fpk.yml（reusable workflow，
# mode=release）出双架构正式版 + 挂 GitHub Release。
#
# 为什么不是"推完 tag 就完事"：publish 用的 GITHUB_TOKEN 推 tag 不会产生可触发的
# push 事件（GitHub 防 workflow 套娃规则，对 dispatch/repository_dispatch 同样生效），
# 所以自动链路必须走 uses: 显式调用。build-fpk 的 `on: push: tags` 仍保留——NAS 上
# 手动推 tag（gh-bridge tag）走的不是你，是 owner PAT，事件正常触发，两条路并存。
name: Publish (merge 后自动打 tag 并发版)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  detect-and-tag:
    runs-on: ubuntu-latest
    outputs:
      new-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          fetch-tags: true

      - name: Tag on version bump
        id: tag
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} 已存在，无需动作。"
            exit 0
          fi
          PREV_VERSION=$(git show HEAD^:package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))" 2>/dev/null || echo "")
          if [ "${PREV_VERSION}" = "${VERSION}" ]; then
            echo "::notice::version ${TAG} 未打过 tag 但本次提交也没改版本号——跳过（若确要补 tag，手动 git tag && push）"
            exit 0
          fi
          git config user.name "release-bot[bot]"
          git config user.email "release-bot[bot]@users.noreply.github.com"
          git tag "${TAG}" HEAD
          git push origin "${TAG}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "→ ${TAG} 已打在 ${GITHUB_SHA:0:7}（版本 ${PREV_VERSION:-?} → ${VERSION}）"

  release-build:
    # 只在本次 run 真的打了新 tag 时才继续（普通合并 main 时上面输出为空 → 跳过）。
    needs: detect-and-tag
    if: needs.detect-and-tag.outputs.new-tag != ''
    permissions:
      contents: write   # 调用方授权：被调 workflow 的 release job 要 contents:write
      actions: write    # 保险丝（review #67 点4）：被调 build job 的 upload/download-artifact
                        # 若按「permissions 未列即 none」口径需要 actions:write，此处给足；
                        # 若默认本就够用，显式声明无害。
    uses: ./.github/workflows/build-fpk.yml
    with:
      tag: ${{ needs.detect-and-tag.outputs.new-tag }}
      mode: release

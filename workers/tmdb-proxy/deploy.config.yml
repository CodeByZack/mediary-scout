# ─── TMDB Proxy 部署配置 ──────────────────────────────────────────────────
# 复制此文件为 deploy.config.yml，填入你的配置后运行 node deploy.mjs

# ─── Worker 配置 ───────────────────────────────────────────────────────────
# Worker 名称（Cloudflare 全局唯一，只能含字母、数字、连字符）
workerName: media-track-tmdb-proxy

# ─── TMDB Token ────────────────────────────────────────────────────────────
# TMDB read token（v3 key 或 v4 token 都行）
# 留空 '' 则不设 CF secret，仅用于部署后验证测试
tmdbToken: ''

# 是否将 tmdbToken 设为 Cloudflare Secret
# true  = 设 secret（推荐，MediaTrack 页面上不用填 token）
# false = 跳过 secret（MediaTrack 页面上需要填 token）
storeSecret: true

# ─── Cloudflare 配置 ───────────────────────────────────────────────────────
# Cloudflare API token（可选，留空则依赖 wrangler login 的浏览器登录）
# 获取: https://dash.cloudflare.com/profile/api-tokens
cfApiToken: ''

# ─── CORS 配置 ─────────────────────────────────────────────────────────────
# 调用方域名（逗号分隔多个）
# 例: "https://your-site.com,https://other-site.com"
# 留空 '' 则不设 CORS secret，代理仅返回 workers.dev 默认 CORS
corsOrigins: ''

# ─── 域名配置 ──────────────────────────────────────────────────────────────
# 自定义域名（如 tmdb.your-domain.com）
# 留空 '' 则仅使用 workers.dev URL（*.workers.dev 在大陆可能被墙）
customDomain: ''

# ─── KV 缓存 ───────────────────────────────────────────────────────────────
# KV namespace 名称（用于缓存 TMDB API 响应，减少重复请求）
# 留空则使用默认名称 "TMDB_CACHE"
kvNamespace: TMDB_CACHE
